<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RoadNest">
  <title>RoadNest</title>
  <!-- den / car cabin arch -->
  <path d="M7 50V29.5A25 25 0 0 1 57 29.5V50"
        fill="none" stroke="#3f5147" stroke-width="5.5" stroke-linecap="round"/>
  <!-- the flat bed: the product's whole point, and the floor of the nest -->
  <path d="M4.5 50h55" fill="none" stroke="#c08b63" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Dog head, front on. A full side-view body turns to mush below about 32px;
       a head with long floppy ears still reads as a dog at favicon size. -->
  <g fill="#1e1e1e">
    <ellipse cx="21.6" cy="38.4" rx="5.1" ry="10.2" transform="rotate(-13 21.6 38.4)"/>
    <ellipse cx="42.4" cy="38.4" rx="5.1" ry="10.2" transform="rotate(13 42.4 38.4)"/>
    <circle cx="32" cy="35.6" r="10"/>
    <ellipse cx="32" cy="42.4" rx="5" ry="4" fill="#3f5147"/>
  </g>
  <ellipse cx="32" cy="40.7" rx="2.4" ry="1.9" fill="#f4efe6"/>
</svg>
